[workspace]
resolver = "2"

members = [
    "zendb-types",
    "zendb-storage",
    "zendb-workspace",
    "zendb-it",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zenin/zendb"
authors = ["ZeninDB Contributors"]

[workspace.dependencies]
# zendb-storage
memmap2 = "0.9"
hashbrown = "0.15"

bincode = { version = "2", features = ["derive"] }

libp2p-identity = { version = "0.2", features = ["ed25519", "peerid", "rand"] }
rand = "0.8"

parking_lot = "0.12"
arc-swap = "1"
