[workspace]
resolver = "2"

members = [
    "zendb-types",
    "zendb-storage",
    "zendb-workspace",
    "zendb-it",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zenin/zendb"
authors = ["ZeninDB Contributors"]

[workspace.dependencies]
# workspace members
zendb-types = { path = "zendb-types", version = "0.1.0" }
zendb-storage = { path = "zendb-storage", version = "0.1.0" }
zendb-workspace = { path = "zendb-workspace", version = "0.1.0" }

# zendb-storage
memmap2 = "0.9.11"
hashbrown = "0.17.1"

bincode = { version = "2.0.1", features = ["derive"] }

libp2p-identity = { version = "0.2.14", features = ["ed25519", "peerid", "rand"] }
multiaddr = "0.18.2"
libp2p = { version = "0.56.0", features = [
    "dns",
    "ed25519",
    "macros",
    "mdns",
    "noise",
    "quic",
    "tcp",
    "tokio",
    "yamux",
] }
futures = "0.3.33"
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
rand = "0.8.7"
tracing = "0.1.44"

parking_lot = "0.12.5"
arc-swap = "1.9.2"
tempfile = "3.27.0"

# zendb-it
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
